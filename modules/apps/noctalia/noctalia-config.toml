[bar.default]
font_family = "Noto Sans CJK JP"
font_scale = 1.1999999806284904
font_weight = 400
icon_color = "primary"
margin_ends = 0
position = "bottom"
radius = 0
shadow = false
show_on_workspace_switch = false
start = [ "launcher", "wallpaper", "workspaces", "cpu", "ram", "temp" ]
thickness = 40

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1418.0
    output = "eDP-1"
    placement_height = 1600.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Noto Sans CJK JP"

[theme]
builtin = "Rosé Pine"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper.default]
path = "/home/kamui/Pictures/Img/Wallpaper/elaina_flat2.jpg"

[wallpaper.last]
path = "/home/kamui/Pictures/Img/Wallpaper/elaina_flat2.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/kamui/Pictures/Img/Wallpaper/elaina_flat2.jpg"
